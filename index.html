<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中國象棋卜卦命盤系統</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "微軟正黑體", "PingFang TC", sans-serif;
    }

    body {
        background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d17 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    h1 {
        color: #f0d98c;
        text-shadow: 0 0 10px rgba(240,217,140,0.6), 2px 2px 4px rgba(0,0,0,0.8);
        margin-bottom: 20px;
        font-size: 28px;
        letter-spacing: 2px;
        text-align: center;
    }

    .main-container {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 1500px;
        width: 100%;
    }

    /* ===================== 命盤卡片容器 ===================== */
    .board-card {
        background: radial-gradient(ellipse at top, #2a1f3d 0%, #0d0d17 80%);
        border-radius: 24px;
        padding: 30px 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.7), inset 0 0 60px rgba(100,80,200,0.1);
        position: relative;
        width: 480px;
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        gap: 12px;
    }

    .board-title {
        text-align: center;
        color: #d4af37;
        font-size: 18px;
        margin-bottom: 10px;
        letter-spacing: 4px;
    }

    /* 左側人生階段標示欄 */
    .stage-sidebar {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        width: 90px;
        padding-top: 95px;
    }

    .sidebar-item {
        font-size: 12px;
        color: #ccc;
        text-align: right;
        padding-right: 8px;
        line-height: 1.4;
        border-right: 2px solid rgba(255,255,255,0.15);
        margin-bottom: 4px;
    }

    .sidebar-item.highlight {
        font-weight: bold;
        font-size: 13px;
    }

    .sidebar-item .range {
        display: block;
        font-size: 11px;
        color: #888;
    }

    .board-content {
        flex: 1;
    }

    .board-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        position: relative;
        padding: 10px 0;
    }

    .stage-label {
        text-align: center;
        font-size: 12px;
        color: #9f8fff;
        margin: 2px 0 2px;
        letter-spacing: 2px;
        text-shadow: 0 0 6px rgba(159,143,255,0.5);
        opacity: 0.9;
        height: 14px;
    }

    .row-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    /* ===================== 3D 立體棋子格 ===================== */
    .slot-3d {
        width: 46px;
        height: 46px;
        perspective: 600px;
        position: relative;
        margin-bottom: 6px;
    }

    .slot-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.7s cubic-bezier(.2,.9,.3,1.2);
        cursor: pointer;
    }

    .slot-3d.flipped .slot-inner {
        transform: rotateY(180deg);
    }

    .slot-face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        font-weight: bold;
        font-size: 18px;
    }

    /* 背面（未翻開，蓋著的棋子背） */
    .slot-back {
        background: radial-gradient(circle at 35% 30%, #5a4a2a, #2b1f0f 75%);
        border: 2px solid #8a6d2f;
        box-shadow: 
            0 4px 8px rgba(0,0,0,0.6),
            inset 0 2px 3px rgba(255,255,255,0.15),
            inset 0 -3px 5px rgba(0,0,0,0.5);
        color: #d4af37;
    }

    .slot-back::after {
        content: '棋';
        opacity: 0.5;
        font-size: 16px;
    }

    .slot-3d.empty-slot .slot-back {
        background: rgba(255,255,255,0.03);
        border: 2px dashed rgba(255,255,255,0.25);
        box-shadow: none;
    }

    .slot-3d.empty-slot .slot-back::after {
        content: '';
    }

    .slot-3d.empty-slot:hover .slot-back {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.5);
    }

    /* 正面（已翻開，顯示棋子字） */
    .slot-front {
        background: radial-gradient(circle at 35% 30%, #fffdf2, #f0e6c8 80%);
        border: 2px solid #8B4513;
        transform: rotateY(180deg);
        box-shadow:
            0 4px 10px rgba(0,0,0,0.5),
            inset 0 2px 3px rgba(255,255,255,0.8),
            inset 0 -3px 5px rgba(0,0,0,0.2);
    }

    .slot-front.red { color: #c62828; }
    .slot-front.black { color: #1a1a1a; }

    /* 起始位置紅框標示 */
    .slot-3d.start-position .slot-back,
    .slot-3d.start-position .slot-front {
        box-shadow: 0 0 0 3px #ff3030, 0 0 14px rgba(255,48,48,0.8);
    }

    .slot-3d.just-placed .slot-inner {
        animation: placeGlow 0.8s ease;
    }

    @keyframes placeGlow {
        0% { filter: drop-shadow(0 0 0px rgba(255,215,0,0)); }
        40% { filter: drop-shadow(0 0 12px rgba(255,215,0,0.9)); }
        100% { filter: drop-shadow(0 0 0px rgba(255,215,0,0)); }
    }

    .slot-number {
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        color: rgba(255,255,255,0.4);
    }

    /* ===================== 控制面板 ===================== */
    .control-panel {
        background: linear-gradient(145deg, #1f1f2e, #15151f);
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        width: 340px;
        height: fit-content;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .control-panel h2 {
        color: #d4af37;
        margin-bottom: 15px;
        font-size: 20px;
        border-bottom: 2px solid #8B4513;
        padding-bottom: 8px;
    }

    .pool-info {
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
        text-align: center;
    }

    .pool-count {
        font-size: 36px;
        font-weight: bold;
        color: #d4af37;
        text-shadow: 0 0 10px rgba(212,175,55,0.5);
    }

    .pool-label {
        font-size: 14px;
        color: #aaa;
    }

    .draw-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #d32f2f, #8c1515);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 10px;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(211, 47, 47, 0.5);
    }

    .draw-btn:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 6px 20px rgba(211, 47, 47, 0.7);
    }

    .draw-btn:disabled {
        background: #444;
        cursor: not-allowed;
        box-shadow: none;
        color: #888;
    }

    .reset-btn {
        width: 100%;
        padding: 12px;
        background: #37474f;
        color: #ddd;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 15px;
        transition: all 0.3s;
    }

    .reset-btn:hover {
        background: #263238;
    }

    .drawn-piece-display {
        text-align: center;
        padding: 20px;
        background: rgba(255,255,255,0.04);
        border-radius: 12px;
        margin-bottom: 15px;
        border: 2px dashed #d4af37;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .drawn-piece-3d {
        width: 72px;
        height: 72px;
        perspective: 500px;
    }

    .drawn-piece-3d-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: flip3d 0.8s cubic-bezier(.2,.9,.3,1.2);
    }

    @keyframes flip3d {
        0% { transform: rotateY(0deg) scale(0.6); }
        100% { transform: rotateY(360deg) scale(1); }
    }

    .drawn-piece-face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fffdf2, #f0e6c8 80%);
        border: 3px solid #8B4513;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        backface-visibility: hidden;
        box-shadow:
            0 6px 14px rgba(0,0,0,0.5),
            inset 0 2px 4px rgba(255,255,255,0.8),
            inset 0 -4px 6px rgba(0,0,0,0.2);
    }

    .drawn-piece-face.red { color: #c62828; }
    .drawn-piece-face.black { color: #1a1a1a; }

    .hint-text {
        font-size: 13px;
        color: #999;
        margin-top: 10px;
        line-height: 1.6;
    }

    .order-indicator {
        font-size: 15px;
        color: #d4af37;
        font-weight: bold;
        margin-top: 8px;
        text-align: center;
        line-height: 1.6;
    }

    .complete-message {
        background: rgba(76,175,80,0.15);
        border: 2px solid #4caf50;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        color: #81c784;
        font-weight: bold;
        margin-bottom: 15px;
    }

    /* ===================== 人生階段說明區 ===================== */
    .stage-info-section {
        margin-top: 15px;
        background: rgba(255,255,255,0.04);
        border-radius: 10px;
        padding: 15px;
    }

    .stage-info-section h3 {
        color: #d4af37;
        font-size: 15px;
        margin-bottom: 10px;
    }

    .stage-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        font-size: 13px;
        color: #ccc;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .stage-row:last-child { border-bottom: none; }

    .stage-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .stage-range {
        color: #999;
        margin-left: auto;
        font-size: 12px;
    }
</style>
</head>
<body>

<h1>🀄 中國象棋卜卦命盤系統 🀄</h1>

<div class="main-container">
    <div class="board-card">
        <div class="stage-sidebar" id="stageSidebar"></div>
        <div class="board-content">
            <div class="board-title">總　格</div>
            <div class="board-grid" id="boardGrid"></div>
        </div>
    </div>

    <div class="control-panel">
        <h2>📜 命盤卜卦控制台</h2>

        <div class="pool-info">
            <div class="pool-count" id="poolCount">32</div>
            <div class="pool-label">剩餘棋子（蓋住中）</div>
        </div>

        <div class="drawn-piece-display" id="drawnDisplay">
            <div style="color:#777; font-size:14px;">尚未抽取棋子</div>
        </div>

        <button class="draw-btn" id="drawBtn" onclick="drawPiece()">🎲 翻開棋子</button>
        <button class="reset-btn" onclick="resetGame()">🔄 重新排盤</button>

        <div id="completeMsg"></div>

        <div class="order-indicator" id="orderIndicator">
            下一步：放置於第 1 顆（紅框標示處）
        </div>

        <div class="hint-text">
            排列順序規則：依照命盤墊上的編號 1 → 2 → 3 ... → 32 依序翻開放置，
            第一顆棋子固定放置於編號 1 的紅框標示處（總格中心）。
        </div>

        <div class="stage-info-section">
            <h3>🔮 人生階段對照</h3>
            <div class="stage-row">
                <span class="stage-dot" style="background:#4fc3f7;"></span>
                學習格 <span class="stage-range">11 ~ 20 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff6ec7;"></span>
                情感格 <span class="stage-range">21 ~ 30 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ffd54f;"></span>
                事業格 <span class="stage-range">31 ~ 40 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#81c784;"></span>
                41 ~ 50 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ba68c8;"></span>
                51 ~ 60 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff8a65;"></span>
                61 ~ 70 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#90a4ae;"></span>
                71 歲以後
            </div>
        </div>
    </div>
</div>

<script>
// ===================== 棋子資料設定 =====================
const pieceSet = [
    {name:'帥', color:'red'},
    {name:'仕', color:'red'}, {name:'仕', color:'red'},
    {name:'相', color:'red'}, {name:'相', color:'red'},
    {name:'俥', color:'red'}, {name:'俥', color:'red'},
    {name:'傌', color:'red'}, {name:'傌', color:'red'},
    {name:'炮', color:'red'}, {name:'炮', color:'red'},
    {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'},
    {name:'將', color:'black'},
    {name:'士', color:'black'}, {name:'士', color:'black'},
    {name:'象', color:'black'}, {name:'象', color:'black'},
    {name:'車', color:'black'}, {name:'車', color:'black'},
    {name:'馬', color:'black'}, {name:'馬', color:'black'},
    {name:'包', color:'black'}, {name:'包', color:'black'},
    {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}
];

// ===================== 命盤結構定義（依據圖片 1~32 編號佈局）=====================
// 列1: 4(single)
// 列2: 2 1 3（起始列，1 為中心起點／總格）
// 列3: 5(single)
// 列4: 7 6 8          <-- 學習格 11~20歲 對照起始（此列為學習格第一組）
// 列5: 9(single)
// 列6: 11 10 12        <-- 學習格
// 列7: 13(single)      <-- 情感格
// 列8: 15 14 16         <-- 情感格
// 列9: 17(single)
// 列10: 19 18 20        <-- 事業格 31~40歲
// 列11: 21(single)      <-- 41~50歲
// 列12: 23 22 24
// 列13: 25(single)      <-- 51~60歲
// 列14: 27 26 28
// 列15: 29(single)      <-- 61~70歲
// 列16: 31 30 32

const boardLayout = [
    {type:'single', nums:[4]},                 // row 0
    {type:'triple', nums:[2,1,3]},              // row 1  起始列（總格）
    {type:'single', nums:[5]},                  // row 2
    {type:'triple', nums:[7,6,8]},              // row 3  學習格 11~20
    {type:'single', nums:[9]},                  // row 4
    {type:'triple', nums:[11,10,12]},           // row 5  情感格 21~30
    {type:'single', nums:[13]},                 // row 6
    {type:'triple', nums:[15,14,16]},           // row 7  事業格 31~40
    {type:'single', nums:[17]},                 // row 8
    {type:'triple', nums:[19,18,20]},           // row 9  41~50
    {type:'single', nums:[21]},                 // row 10
    {type:'triple', nums:[23,22,24]},           // row 11 51~60
    {type:'single', nums:[25]},                 // row 12
    {type:'triple', nums:[27,26,28]},           // row 13 61~70
    {type:'single', nums:[29]},                 // row 14
    {type:'triple', nums:[31,30,32]}            // row 15 71歲以後
];

const START_ROW = 1; // 第二列（index 1）為起始列（總格中心＝編號1）

// ===================
