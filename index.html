<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>中國象棋卜卦命盤系統</title>
<style>
body {
    font-family: "微軟正黑體", sans-serif;
    background: linear-gradient(135deg, #2c1810, #3d2817);
    color: #fff;
    text-align: center;
    padding: 20px;
}

h1 { color: #ffd54f; margin-bottom: 20px; }

.main-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.board-card {
    display: flex;
    background: #4a2f1f;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.stage-sidebar {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin-right: 15px;
    width: 70px;
}

.stage-label {
    writing-mode: vertical-rl;
    font-size: 13px;
    border-radius: 6px;
    padding: 6px 2px;
    margin: 2px 0;
    color: #222;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
}

.board-content { flex: 1; }

.board-title {
    font-size: 20px;
    color: #ffd54f;
    margin-bottom: 10px;
    letter-spacing: 4px;
}

.board-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
}

.board-row {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.cell {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.cell.covered {
    background: linear-gradient(145deg, #8b6914, #6b4e0a);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

.cell.start-cell {
    border: 3px solid red;
    box-shadow: 0 0 10px rgba(255,0,0,0.6);
}

.cell-number {
    position: absolute;
    top: -18px;
    font-size: 11px;
    color: #ffd54f;
}

.chess-piece {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    box-shadow:
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.3),
        inset 0 -2px 4px rgba(0,0,0,0.3);
    border: 2px solid;
    transform-style: preserve-3d;
    transition: transform 0.6s;
}

.chess-piece.red {
    background: radial-gradient(circle at 30% 30%, #ffe0e0, #d32f2f);
    color: #8b0000;
    border-color: #a00;
}

.chess-piece.black {
    background: radial-gradient(circle at 30% 30%, #e0e0e0, #333);
    color: #000;
    border-color: #000;
}

.chess-piece.flip-animate {
    animation: flipAnimation 0.6s ease-in-out;
}

@keyframes flipAnimation {
    0% { transform: rotateY(0deg); opacity: 0.3; }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0deg); opacity: 1; }
}

.control-panel {
    background: #4a2f1f;
    border-radius: 12px;
    padding: 20px;
    width: 300px;
    text-align: left;
}

.pool-info { text-align: center; margin-bottom: 15px; }
.pool-count { font-size: 36px; color: #ffd54f; font-weight: bold; }
.pool-label { font-size: 13px; color: #ccc; }

.drawn-piece-display {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3a2415;
    border-radius: 8px;
    margin-bottom: 15px;
}

.draw-btn, .reset-btn {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

.draw-btn { background: #ffd54f; color: #3a2415; }
.draw-btn:disabled { background: #777; cursor: not-allowed; }
.reset-btn { background: #c62828; color: #fff; }

#completeMsg { text-align: center; color: #81c784; font-weight: bold; margin-bottom: 10px; }

.order-indicator {
    background: #3a2415;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    color: #ffd54f;
}

.hint-text { font-size: 12px; color: #aaa; margin-bottom: 15px; line-height: 1.6; }

.stage-info-section h3 { color: #ffd54f; font-size: 15px; margin-bottom: 10px; }

.stage-row {
    display: flex;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
}

.stage-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
}

.stage-range {
    color: #999;
    margin-left: auto;
    font-size: 12px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


</head>
<body>

<h1>🀄 中國象棋卜卦命盤系統 🀄</h1>

<div class="main-container">
    <div class="board-card">
        <div class="stage-sidebar" id="stageSidebar"></div>
        <div class="board-content">
            <div class="board-title">總　格</div>
            <div class="board-grid" id="boardGrid"></div>
        </div>
    </div>

    <div class="control-panel">
        <h2>📜 命盤卜卦控制台</h2>

        <div class="pool-info">
            <div class="pool-count" id="poolCount">32</div>
            <div class="pool-label">剩餘棋子（蓋住中）</div>
        </div>

        <div class="drawn-piece-display" id="drawnDisplay">
            <div style="color:#777; font-size:14px;">尚未抽取棋子</div>
        </div>

		<button class="draw-btn" id="drawBtn" onclick="drawPiece()">🎲 翻開棋子</button>
		<button class="reset-btn" onclick="resetGame()">🔄 重新排盤</button>
		<button class="reset-btn" onclick="saveResult()">💾 儲存命盤</button>
		<button class="reset-btn" onclick="loadResult()">📂 載入命盤</button>
		<button class="reset-btn" onclick="captureBoard()">📸 截圖命盤</button>

		<div id="completeMsg"></div>

        <div id="completeMsg"></div>

        <div class="order-indicator" id="orderIndicator">
            下一步：放置於第 1 顆（紅框標示處）
        </div>

        <div class="hint-text">
            排列順序規則：依照命盤墊上的編號 1 → 2 → 3 → … → 32 依序翻開放置，
            第一顆棋子固定放置於編號 1 的紅框標示處（總格中心）。
        </div>

        <div class="stage-info-section">
            <h3>🔮 人生階段對照</h3>
            <div class="stage-row">
                <span class="stage-dot" style="background:#4fc3f7;"></span>
                學習格 <span class="stage-range">11 ~ 20 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff6ec7;"></span>
                情感格 <span class="stage-range">21 ~ 30 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ffd54f;"></span>
                事業格 <span class="stage-range">31 ~ 40 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#81c784;"></span>
                41 ~ 50 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ba68c8;"></span>
                51 ~ 60 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff8a65;"></span>
                61 ~ 70 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#90a4ae;"></span>
                71 歲以後
            </div>
        </div>
    </div>
</div>

<script>
// ===================== 棋子資料設定 =====================
const pieceSet = [
    {name:'帥', color:'red'},
    {name:'仕', color:'red'}, {name:'仕', color:'red'},
    {name:'相', color:'red'}, {name:'相', color:'red'},
    {name:'俥', color:'red'}, {name:'俥', color:'red'},
    {name:'傌', color:'red'}, {name:'傌', color:'red'},
    {name:'炮', color:'red'}, {name:'炮', color:'red'},
    {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'},
    {name:'將', color:'black'},
    {name:'士', color:'black'}, {name:'士', color:'black'},
    {name:'象', color:'black'}, {name:'象', color:'black'},
    {name:'車', color:'black'}, {name:'車', color:'black'},
    {name:'馬', color:'black'}, {name:'馬', color:'black'},
    {name:'包', color:'black'}, {name:'包', color:'black'},
    {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}
];

// ===================== 命盤結構定義（依據圖片 1~32 編號佈局）=====================
// 列1: 4(single)
// 列2: 2 1 3（起始列，1 為中心起點／總格）
// 列3: 5(single)
// 列4: 7 6 8           <-- 學習格 11~20歲 對照起始
// 列5: 9(single)
// 列6: 11 10 12        <-- 學習格
// 列7: 13(single)      <-- 情感格
// 列8: 15 14 16        <-- 情感格
// 列9: 17(single)
// 列10: 19 18 20       <-- 事業格 31~40歲
// 列11: 21(single)     <-- 41~50歲
// 列12: 23 22 24
// 列13: 25(single)     <-- 51~60歲
// 列14: 27 26 28
// 列15: 29(single)     <-- 61~70歲
// 列16: 31 30 32       <-- 71歲以後

const boardLayout = [
    {type:'single', nums:[4]},
    {type:'triple', nums:[2,1,3]},
    {type:'single', nums:[5]},
    {type:'triple', nums:[7,6,8]},
    {type:'single', nums:[9]},
    {type:'triple', nums:[11,10,12]},
    {type:'single', nums:[13]},
    {type:'triple', nums:[15,14,16]},
    {type:'single', nums:[17]},
    {type:'triple', nums:[19,18,20]},
    {type:'single', nums:[21]},
    {type:'triple', nums:[23,22,24]},
    {type:'single', nums:[25]},
    {type:'triple', nums:[27,26,28]},
    {type:'single', nums:[29]},
    {type:'triple', nums:[31,30,32]}
];

// 各人生階段對應的棋盤編號範圍（左側標示用）
const stageRanges = [
    {label:'總格',   range:[1,1],   color:'#e0e0e0'},
    {label:'學習格', range:[5,13],  color:'#4fc3f7'},
    {label:'情感格', range:[13,17], color:'#ff6ec7'},
    {label:'事業格', range:[17,21], color:'#ffd54f'},
    {label:'41~50',  range:[21,25], color:'#81c784'},
    {label:'51~60',  range:[25,29], color:'#ba68c8'},
    {label:'61~70',  range:[29,32], color:'#ff8a65'},
    {label:'71以後', range:[32,32], color:'#90a4ae'}
];
</script>

<script>
let pool = [];
let currentIndex = 0;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function renderBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';
    boardLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';
        row.nums.forEach(num => {
            const cell = document.createElement('div');
            cell.className = 'cell covered';
            cell.id = `cell-${num}`;
            if (num === 1) cell.classList.add('start-cell');
            const label = document.createElement('span');
            label.className = 'cell-number';
            label.textContent = num;
            cell.appendChild(label);
            rowDiv.appendChild(cell);
        });
        grid.appendChild(rowDiv);
    });
}

function renderSidebar() {
    const sidebar = document.getElementById('stageSidebar');
    sidebar.innerHTML = '';
    stageRanges.forEach(stage => {
        const div = document.createElement('div');
        div.className = 'stage-label';
        div.style.background = stage.color;
        div.textContent = stage.label;
        sidebar.appendChild(div);
    });
}

function drawPiece() {
    if (pool.length === 0 || currentIndex >= 32) return;

    const piece = pool.pop();
    const position = currentIndex + 1;
    const cell = document.getElementById(`cell-${position}`);

    cell.classList.remove('covered');

    const pieceEl = document.createElement('div');
    pieceEl.className = `chess-piece ${piece.color} flip-animate`;
    pieceEl.textContent = piece.name;
    cell.appendChild(pieceEl);

    document.getElementById('drawnDisplay').innerHTML =
        `<div class="chess-piece ${piece.color}" style="margin:0 auto;">${piece.name}</div>`;

    currentIndex++;
    document.getElementById('poolCount').textContent = pool.length;

    if (currentIndex < 32) {
        document.getElementById('orderIndicator').textContent =
            `下一步：放置於第 ${currentIndex + 1} 顆`;
    } else {
        document.getElementById('completeMsg').textContent = '✅ 命盤排列完成！';
        document.getElementById('drawBtn').disabled = true;
    }
}

function resetGame() {
    pool = shuffle([...pieceSet]);
    currentIndex = 0;
    document.getElementById('poolCount').textContent = 32;
    document.getElementById('completeMsg').textContent = '';
    document.getElementById('drawBtn').disabled = false;
    document.getElementById('drawnDisplay').innerHTML =
        '<div style="color:#777; font-size:14px;">尚未抽取棋子</div>';
    document.getElementById('orderIndicator').textContent =
        '下一步：放置於第 1 顆（紅框標示處）';
    renderBoard();
    renderSidebar();
}

window.onload = resetGame;

function captureBoard() {
    const boardCard = document.querySelector('.board-card');
    html2canvas(boardCard, {
        backgroundColor: '#15151f',
        scale: 2
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `命盤卜卦_${new Date().getTime()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    });
}

function isLocalStorageAvailable() {
    try {
        const testKey = '__test_storage__';
        localStorage.setItem(testKey, '1');
        localStorage.removeItem(testKey);
        return true;
    } catch (e) {
        console.error('localStorage 無法使用：', e);
        return false;
    }
}

function saveResult() {
    if (!isLocalStorageAvailable()) {
        alert('偵測到您的瀏覽器無法使用本機儲存功能，請確認：\n1. 是否處於無痕瀏覽模式\n2. 是否透過 file:// 直接開啟網頁\n3. 是否有隱私防護擴充功能阻擋');
        return;
    }

    const name = prompt("請為您的命盤命名（例如：2026生涯占卜）:");
    if (!name || !name.trim()) return;

    const resultData = {
        name: name.trim(),
        timestamp: new Date().toISOString(),
        pieces: placedPieces
    };

    let savedResults = JSON.parse(localStorage.getItem('chessDivinationResults') || '[]');
    savedResults.push(resultData);
    localStorage.setItem('chessDivinationResults', JSON.stringify(savedResults));

    console.log('[儲存命盤] 目前儲存總筆數：', savedResults.length, savedResults);
    alert(`命盤「${resultData.name}」已儲存！目前共有 ${savedResults.length} 筆紀錄。`);
    generateInterpretation(true);

    }


function loadResult() {
    if (!isLocalStorageAvailable()) {
        alert('偵測到您的瀏覽器無法使用本機儲存功能，無法載入先前儲存的命盤。');
        return;
    }

    const rawData = localStorage.getItem('chessDivinationResults');
    console.log('[載入命盤] 讀取到的原始字串：', rawData);

    let savedResults = [];
    try {
        savedResults = JSON.parse(rawData || '[]');
    } catch (e) {
        console.error('[載入命盤] JSON 解析失敗：', e);
        alert('讀取紀錄時發生格式錯誤，建議清除瀏覽器快取後重新儲存。');
        return;
    }

    if (!savedResults || savedResults.length === 0) {
        alert("沒有已儲存的命盤紀錄。\n\n請檢查：\n1. 目前網址列是否與先前儲存時相同（同一個 http/https 來源）\n2. 是否使用無痕模式瀏覽\n3. 是否直接雙擊 HTML 檔案開啟（建議改用本機伺服器開啟）");
        return;
    }

    const savedNames = savedResults.map(r => r.name);
    const selectedName = prompt(`請選擇要載入的命盤：\n${savedNames.join('\n')}`);
    if (!selectedName) return;

    const trimmedInput = selectedName.trim();
    const resultToLoad = savedResults.find(r => r.name.trim() === trimmedInput);

    if (!resultToLoad) {
        alert("找不到該命盤紀錄，請確認輸入的名稱與列表完全一致。");
        return;
    }

    placedPieces = resultToLoad.pieces;
    currentIndex = Object.keys(placedPieces).length;
    document.getElementById('poolCount').textContent = 32 - currentIndex;
    document.getElementById('drawBtn').disabled = true;
    document.getElementById('completeMsg').textContent = `命盤「${resultToLoad.name}」已載入`;

    renderLoadedBoard();
    alert(`命盤「${resultToLoad.name}」已載入。`);
}


function renderLoadedBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';
    boardLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';
        row.nums.forEach(num => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${num}`;
            if (num === 1) cell.classList.add('start-cell');

            const piece = placedPieces[num];
            if (piece) {
                const pieceEl = document.createElement('div');
                pieceEl.className = `chess-piece ${piece.color}`;
                pieceEl.textContent = piece.name;
                cell.appendChild(pieceEl);
            } else {
                cell.classList.add('covered');
                const label = document.createElement('span');
                label.className = 'slot-number';
                label.textContent = num;
                cell.appendChild(label);
            }
            rowDiv.appendChild(cell);
        });
        grid.appendChild(rowDiv);
    });
    renderSidebar();
}

function generateInterpretation(isSaved = false) {
    let interpretationHtml = "";
    const title = isSaved ? "命盤解讀" : "本次占卜結果";

    const stageOrder = ['總格','學習格','情感格','事業格','41~50','51~60','61~70','71以後'];
    const stagePieceCounts = {};
    stageOrder.forEach(stage => stagePieceCounts[stage] = { red: 0, black: 0, total: 0 });

    for (const posStr in placedPieces) {
        const pos = parseInt(posStr);
        const piece = placedPieces[pos];
        let currentStage = '總格';
        for (const stage of stageRanges) {
            if (pos >= stage.range[0] && pos <= stage.range[1]) {
                currentStage = stage.label;
                break;
            }
        }
        stagePieceCounts[currentStage][piece.color]++;
        stagePieceCounts[currentStage].total++;
    }

    interpretationHtml += `<h2>${title}</h2><p>本次占卜結果顯示：</p><ul>`;
    stageOrder.forEach(stage => {
        const c = stagePieceCounts[stage];
        if (c.total > 0) {
            interpretationHtml += `<li><strong>${stage}</strong>：紅棋 ${c.red} 顆、黑棋 ${c.black} 顆（共 ${c.total} 顆）</li>`;
        }
    });
    interpretationHtml += "</ul><p>請綜合以上各階段的棋子分佈，並結合個人情況進行體悟。</p>";

    if (isSaved) {
        alert("命盤解讀:\n" + interpretationHtml.replace(/<[^>]*>/g, ''));
    } else {
        document.getElementById('completeMsg').innerHTML = interpretationHtml;
    }
}


</script>

</body>
</html>
