<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>象棋卜卦解憂室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-paper: #F6F3EC;
    --card-bg: #FCFBF9;
    --border-warm: #E3DCD0;
    --text-ink: #3E3A35;
    --text-muted: #827B70;
    --accent-gold: #B89655;
    --accent-wood: #8C7355;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Noto Sans TC', "微軟正黑體", sans-serif;
    background-color: var(--bg-paper);
    /* 文青宣紙微點陣質感底圖 */
    background-image: 
        radial-gradient(rgba(140, 115, 85, 0.08) 1px, transparent 1px),
        radial-gradient(rgba(184, 150, 85, 0.05) 1px, var(--bg-paper) 1px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    color: var(--text-ink);
    text-align: center;
    padding: 6px; /* 極小化頁面邊框 */
    margin: 0;
}

/* 頂部極簡文青標題列 */
.app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 2px 0 8px 0;
}

h1 {
    font-family: 'Noto Serif TC', "標楷體", serif;
    color: var(--text-ink);
    font-size: 22px;
    margin: 0;
    letter-spacing: 3px;
    font-weight: 700;
}

.header-stamp {
    background: #B8544B;
    color: #FFF;
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 1px;
    box-shadow: 0 1px 3px rgba(184, 84, 75, 0.3);
}

.main-container {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-start;
    position: relative;
    max-width: 960px;
    margin: 0 auto;
}

/* 左側命盤卡片 */
.board-card {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border-warm);
    border-radius: 14px;
    padding: 14px 12px;
    box-shadow: 0 6px 20px rgba(62, 58, 53, 0.06);
    position: relative;
}

/* 左側階段欄：相對定位並容納橫式文字 */
.stage-sidebar {
    position: relative;
    margin-right: 12px;
    width: 82px;
    flex-shrink: 0;
}

/* 階段標籤：莫蘭迪文青色系、橫式由左到右排列 */
.stage-label {
    position: absolute;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    writing-mode: horizontal-tb;
    font-size: 12px;
    border-radius: 8px;
    padding: 5px 4px;
    color: #3E3A35;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
    text-align: center;
    box-shadow: 0 2px 6px rgba(62, 58, 53, 0.08);
    border: 1px solid rgba(140, 115, 85, 0.2);
}

.stage-label .sub-text {
    font-size: 10px;
    margin-top: 2px;
    font-weight: 500;
    color: #5A534A;
}

.board-content { flex: 1; }

.board-title {
    display: none;
}

.board-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
}

.board-row {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.cell {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
}

/* 命盤未翻開底格：溫潤茶金木紋質感 */
.cell.covered {
    background: radial-gradient(circle at 35% 35%, #EFECE6, #DFD8CA 70%, #CFC5B4 100%);
    box-shadow: inset 0 2px 5px rgba(62, 58, 53, 0.15), 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid #C8BFA8;
}

.cell.start-cell {
    border: 2.5px solid #C85A52;
    box-shadow: 0 0 10px rgba(200, 90, 82, 0.35);
}

/* 最新放入棋子的高亮提示 */
.cell.active-target {
    box-shadow: 0 0 0 3px #D4A359, 0 0 16px rgba(212, 163, 89, 0.65) !important;
    transform: scale(1.06);
    z-index: 5;
}

/* 1-32 數字適當加大並置於命盤棋子格正中央 */
.cell-number {
    position: absolute;
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    font-weight: 700;
    color: #7D7262;
    pointer-events: none;
    user-select: none;
}

/* 當格子已翻開放入棋子後，隱藏原本底部的編號 */
.cell:not(.covered) .cell-number {
    display: none;
}

/* 翻開後的象棋：溫潤象牙底配胭脂紅/松煙墨 */
.chess-piece {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif TC', "標楷體", serif;
    font-size: 21px;
    font-weight: 700;
    box-shadow:
        0 3px 7px rgba(62, 58, 53, 0.22),
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        inset 0 -2px 4px rgba(140, 115, 85, 0.25);
    border: 2px solid;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    z-index: 2;
    position: relative;
}

.chess-piece::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: 0.35;
    pointer-events: none;
}

.chess-piece.red {
    background: radial-gradient(circle at 30% 30%, #FFFDF9, #F7EFE6 65%, #EADBC8 100%);
    color: #B84239;
    border-color: #C45A52;
}

.chess-piece.black {
    background: radial-gradient(circle at 30% 30%, #FFFDF9, #F3F1EC 65%, #E0DDD5 100%);
    color: #2C2A29;
    border-color: #4A4642;
}

.chess-piece.flip-animate {
    animation: flipAnimation 0.55s ease-in-out;
}

@keyframes flipAnimation {
    0% { transform: rotateY(0deg) scale(0.85); opacity: 0.3; }
    50% { transform: rotateY(90deg) scale(1.05); }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}

/* 右側動態跟隨外框 */
.control-wrapper {
    width: 390px;
    transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
    will-change: transform;
}

.control-panel {
    background: var(--card-bg);
    border: 1px solid var(--border-warm);
    border-radius: 14px;
    padding: 14px;
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    box-shadow: 0 6px 20px rgba(62, 58, 53, 0.06);
}

.panel-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.control-panel h2 {
    font-family: 'Noto Serif TC', serif;
    margin: 0;
    font-size: 17px;
    color: var(--text-ink);
    letter-spacing: 1px;
}

.btn-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
}

.reset-btn {
    padding: 8px 4px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    color: #fff;
    box-shadow: 0 2px 5px rgba(62, 58, 53, 0.12);
    transition: transform 0.15s ease, filter 0.15s ease;
    white-space: nowrap;
}
.reset-btn:hover { filter: brightness(1.06); }
.reset-btn:active { transform: scale(0.97); }

.btn-restart { background: #B85D54; }
.btn-save    { background: #5B7B8C; }
.btn-load    { background: #6A8D73; }
.btn-capture { background: #C2884E; }

#completeMsg {
    text-align: center;
    color: #4A7A58;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.4;
    font-size: 13px;
    background: #EFF5F0;
    border-radius: 8px;
    padding: 0;
}
#completeMsg:not(:empty) {
    padding: 8px 10px;
    border: 1px solid #C8DFCE;
}

/* 狀態與順序合併顯示區塊 */
.status-container {
    background: #F4F0E8;
    border: 1px solid var(--border-warm);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.status-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.order-indicator {
    background: #FFFDF9;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #8C6239;
    border: 1px solid #E3DCD0;
    text-align: left;
}

.pool-info {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding-left: 2px;
}
.pool-count {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    color: #B85D54;
    font-weight: 700;
    line-height: 1;
}
.pool-label { font-size: 12px; color: var(--text-muted); }

.drawn-piece-display {
    width: 62px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EAE4D7;
    border-radius: 8px;
    border: 1px inset #D8D0C0;
}

.hint-text {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.45;
}

/* 散落區 */
.scatter-section {
    background: transparent;
    display: flex;
    flex-direction: column;
    height: 250px;
}

.scatter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-warm);
}

.scatter-header h3 {
    font-family: 'Noto Serif TC', serif;
    margin: 0;
    color: var(--text-ink);
    font-size: 14px;
}

.shuffle-btn {
    background: #B89655;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(184, 150, 85, 0.25);
    transition: background 0.2s, transform 0.15s;
}

.shuffle-btn:hover:not(:disabled) {
    background: #A38242;
}

.shuffle-btn:disabled {
    background: #D0C9BC;
    cursor: not-allowed;
    color: #8C857B;
    box-shadow: none;
}

/* 散落棋盤池：溫潤亞麻茶席質感 */
.scatter-pool {
    position: relative;
    flex: 1;
    background: radial-gradient(circle at center, #EAE3D5 0%, #DED5C4 100%);
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #D0C6B4;
    box-shadow: inset 0 3px 10px rgba(62, 58, 53, 0.12);
}

/* 立體銀灰色並帶金粉點綴的蓋牌棋子 */
.scatter-piece {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background-image:
        radial-gradient(circle at 24% 28%, rgba(255, 223, 100, 0.95) 0.6px, transparent 1.8px),
        radial-gradient(circle at 72% 22%, rgba(255, 200, 50, 0.9) 0.9px, transparent 2px),
        radial-gradient(circle at 46% 52%, rgba(255, 235, 130, 0.95) 0.6px, transparent 1.6px),
        radial-gradient(circle at 28% 74%, rgba(218, 165, 32, 0.9) 1px, transparent 2.2px),
        radial-gradient(circle at 78% 68%, rgba(255, 215, 0, 0.85) 0.8px, transparent 1.8px),
        radial-gradient(circle at 58% 82%, rgba(255, 240, 150, 0.95) 0.6px, transparent 1.5px),
        radial-gradient(circle at 18% 52%, rgba(238, 180, 34, 0.85) 0.7px, transparent 1.8px),
        radial-gradient(circle at 64% 38%, rgba(255, 215, 0, 0.8) 0.6px, transparent 1.5px),
        radial-gradient(circle at 38% 20%, rgba(255, 230, 110, 0.9) 0.5px, transparent 1.5px),
        radial-gradient(circle at 30% 25%, #F8FAFC 0%, #CFD4DA 38%, #888F98 78%, #525860 100%);
    box-shadow:
        0 3px 5px rgba(62, 58, 53, 0.45),
        0 1px 2px rgba(0, 0, 0, 0.35),
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        inset 0 -2px 4px rgba(45, 50, 56, 0.8),
        inset 0 0 6px rgba(255, 215, 0, 0.3);
    border: 1.5px solid #A8AFB8;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), 
                top 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), 
                left 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), 
                opacity 0.3s ease,
                box-shadow 0.2s ease;
    z-index: 10;
}

.scatter-piece::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    right: 3px;
    bottom: 3px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 215, 0, 0.55);
    pointer-events: none;
}

.scatter-piece:hover {
    box-shadow:
        0 0 12px #D4A359,
        0 4px 8px rgba(62, 58, 53, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.95);
    border-color: #E6C17A;
    z-index: 100 !important;
}

.scatter-piece.drawn {
    opacity: 0;
    pointer-events: none;
    transform: scale(0) !important;
}

/* ==================== 6.1吋以上手機版 (RWD 雙視窗同步操作體驗) ==================== */
@media (max-width: 820px) {
    body {
        padding: 4px 4px 310px 4px; /* 預留底部固定抽牌台空間，讓上方命盤可完整捲動 */
    }

    .app-header {
        margin: 2px 0 6px 0;
    }

    h1 {
        font-size: 19px;
    }

    .main-container {
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .board-card {
        width: 100%;
        max-width: 430px;
        padding: 10px 8px;
        justify-content: center;
    }

    .stage-sidebar {
        width: 74px;
        margin-right: 8px;
    }

    .stage-label {
        font-size: 11px;
        padding: 4px 2px;
    }

    .stage-label .sub-text {
        font-size: 9.5px;
    }

    .board-grid {
        gap: 4px;
    }

    .board-row {
        gap: 6px;
    }

    .cell {
        width: 46px;
        height: 46px;
    }

    .cell-number {
        font-size: 15px;
    }

    .chess-piece {
        width: 42px;
        height: 42px;
        font-size: 18px;
    }

    /* 手機版底部固定式卜卦抽屜：不需上下來回滑動即可邊點選邊看上方命盤落子 */
    .control-wrapper {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100%;
        z-index: 1000;
        transform: none !important;
        padding: 0 4px 4px 4px;
        background: linear-gradient(to top, rgba(246,243,236,0.98) 85%, rgba(246,243,236,0));
    }

    .control-panel {
        max-width: 460px;
        margin: 0 auto;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(252, 251, 249, 0.98);
        backdrop-filter: blur(8px);
        box-shadow: 0 -4px 18px rgba(62, 58, 53, 0.15);
        border: 1px solid #D5CBB8;
    }

    .panel-top-bar {
        margin-bottom: 6px;
    }

    .control-panel h2 {
        font-size: 14px;
    }

    .btn-group {
        margin-bottom: 6px;
        gap: 5px;
    }

    .reset-btn {
        padding: 6px 2px;
        font-size: 11.5px;
    }

    .hint-text {
        display: none; /* 手機版隱藏冗長提示，把空間留給棋盤與散落區 */
    }

    .status-container {
        padding: 5px 8px;
        margin-bottom: 6px;
    }

    .order-indicator {
        font-size: 11.5px;
        padding: 3px 6px;
    }

    .pool-count {
        font-size: 18px;
    }

    .drawn-piece-display {
        width: 48px;
        height: 44px;
    }

    .scatter-section {
        height: 148px;
    }

    .scatter-header {
        margin-bottom: 4px;
        padding-top: 4px;
    }

    .scatter-header h3 {
        font-size: 12.5px;
    }

    .shuffle-btn {
        padding: 4px 10px;
        font-size: 11.5px;
    }

    .scatter-piece {
        width: 31px;
        height: 31px;
        margin-left: -15.5px;
        margin-top: -15.5px;
    }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

<header class="app-header">
    <span class="header-stamp">歲次吉日</span>
    <h1>象棋卜卦解憂室</h1>
</header>

<div class="main-container">
    <!-- 左側命盤區 -->
    <div class="board-card" id="boardCard">
        <div class="stage-sidebar" id="stageSidebar"></div>
        <div class="board-content">
            <div class="board-title"></div>
            <div class="board-grid" id="boardGrid"></div>
        </div>
    </div>

    <!-- 右側控制台 (電腦版動態對齊高度 / 手機版底部固定懸浮工作台) -->
    <div class="control-wrapper" id="controlWrapper">
        <div class="control-panel" id="controlPanel">
            <div class="panel-top-bar">
                <h2>📜 掌櫃解憂所</h2>
                <span style="font-size:11px; color:var(--text-muted);">靜心默念所求之事</span>
            </div>

            <div class="btn-group">
                <button class="reset-btn btn-restart" onclick="resetGame()">🔄 重新排盤</button>
                <button class="reset-btn btn-save" onclick="saveResult()">💾 儲存命盤</button>
                <button class="reset-btn btn-load" onclick="loadResult()">📂 載入命盤</button>
                <button class="reset-btn btn-capture" onclick="captureBoard()">📸 截圖命盤</button>
            </div>

            <div id="completeMsg"></div>

            <!-- 狀態顯示區塊 -->
            <div class="status-container">
                <div class="status-left">
                    <div class="order-indicator" id="orderIndicator">
                        下一步：放置於第 1 顆（紅框處）
                    </div>
                    <div class="pool-info">
                        <span class="pool-label">剩餘未抽</span>
                        <span class="pool-count" id="poolCount">32</span>
                        <span class="pool-label">顆棋子</span>
                    </div>
                </div>
                <div class="drawn-piece-display" id="drawnDisplay">
                    <div style="color:#9E9589; font-size:11px;">待翻牌</div>
                </div>
            </div>

            <div class="hint-text">
                排列規則：排盤前最多可洗牌 3 次，開始抽棋後即鎖定不可洗牌。點選下方攤開的銀灰金粉棋子，畫面將自動對齊命盤落子位置。
            </div>

            <!-- 散落棋子與洗牌區 -->
            <div class="scatter-section">
                <div class="scatter-header">
                    <h3>✨ 卜卦區（請憑直覺點選）</h3>
                    <button id="shuffleBtn" class="shuffle-btn" onclick="shuffleScatterPool()">✋ 洗牌 (剩 3 次)</button>
                </div>
                <div id="scatterPool" class="scatter-pool"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ===================== 棋子資料設定 =====================
const pieceSet = [
    {name:'帥', color:'red'},
    {name:'仕', color:'red'}, {name:'仕', color:'red'},
    {name:'相', color:'red'}, {name:'相', color:'red'},
    {name:'俥', color:'red'}, {name:'俥', color:'red'},
    {name:'傌', color:'red'}, {name:'傌', color:'red'},
    {name:'炮', color:'red'}, {name:'炮', color:'red'},
    {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'}, {name:'兵', color:'red'},
    {name:'將', color:'black'},
    {name:'士', color:'black'}, {name:'士', color:'black'},
    {name:'象', color:'black'}, {name:'象', color:'black'},
    {name:'車', color:'black'}, {name:'車', color:'black'},
    {name:'馬', color:'black'}, {name:'馬', color:'black'},
    {name:'包', color:'black'}, {name:'包', color:'black'},
    {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}, {name:'卒', color:'black'}
];

const boardLayout = [
    {type:'single', nums:[4]},
    {type:'triple', nums:[2,1,3]},
    {type:'single', nums:[5]},
    {type:'triple', nums:[7,6,8]},
    {type:'single', nums:[9]},
    {type:'triple', nums:[11,10,12]},
    {type:'single', nums:[13]},
    {type:'triple', nums:[15,14,16]},
    {type:'single', nums:[17]},
    {type:'triple', nums:[19,18,20]},
    {type:'single', nums:[21]},
    {type:'triple', nums:[23,22,24]},
    {type:'single', nums:[25]},
    {type:'triple', nums:[27,26,28]},
    {type:'single', nums:[29]},
    {type:'triple', nums:[31,30,32]}
];

// 各人生階段對應的棋盤編號範圍、指定對齊的格子編號(alignCell)與文青莫蘭迪色票
const stageRanges = [
    {key:'總格',   title:'總格',   sub:'',        alignCell:2,  range:[1,4],   color:'#E8E2D5'},
    {key:'學習格', title:'學習格', sub:'11-20歲', alignCell:7,  range:[5,8],   color:'#D4E4EC'},
    {key:'情感格', title:'情感格', sub:'21-30歲', alignCell:11, range:[9,12],  color:'#F2D6D8'},
    {key:'事業格', title:'事業格', sub:'31-40歲', alignCell:15, range:[13,16], color:'#F3E3C3'},
    {key:'41~50',  title:'41-50歲', sub:'',       alignCell:19, range:[17,20], color:'#D5E6D6'},
    {key:'51~60',  title:'51-60歲', sub:'',       alignCell:23, range:[21,24], color:'#E2D5E8'},
    {key:'61~70',  title:'61-70歲', sub:'',       alignCell:27, range:[25,28], color:'#F5D9C8'},
    {key:'71-80',  title:'71-80歲', sub:'',       alignCell:31, range:[29,32], color:'#D8E0E5'}
];
</script>

<script>
let remainingPieces = []; 
let currentIndex = 0;
let placedPieces = {}; 
let shuffleCount = 3;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// 產生 32 個不重疊的散落座標（8x4 虛擬網格 + 隨機微幅偏移）
function generateNonOverlappingPositions() {
    const cols = 8;
    const rows = 4;
    const slots = [];

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const baseX = (c + 0.5) * (100 / cols);
            const baseY = (r + 0.5) * (100 / rows);
            const jitterX = (Math.random() - 0.5) * 2.0;
            const jitterY = (Math.random() - 0.5) * 4.0;
            slots.push({
                left: baseX + jitterX,
                top: baseY + jitterY,
                rotate: Math.random() * 360
            });
        }
    }
    return shuffle(slots);
}

function renderBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';
    boardLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';
        row.nums.forEach(num => {
            const cell = document.createElement('div');
            cell.className = 'cell covered';
            cell.id = `cell-${num}`;
            if (num === 1) cell.classList.add('start-cell');
            const label = document.createElement('span');
            label.className = 'cell-number';
            label.textContent = num;
            cell.appendChild(label);
            rowDiv.appendChild(cell);
        });
        grid.appendChild(rowDiv);
    });
}

// 繪製左側階段欄，並精準對齊指定編號 (2, 7, 11, 15, 19, 23, 27, 31) 的格子高度
function renderSidebar() {
    const sidebar = document.getElementById('stageSidebar');
    const boardContent = document.querySelector('.board-content');
    sidebar.innerHTML = '';

    if (boardContent) {
        sidebar.style.height = boardContent.offsetHeight + 'px';
    }

    const sidebarRect = sidebar.getBoundingClientRect();

    stageRanges.forEach(stage => {
        const div = document.createElement('div');
        div.className = 'stage-label';
        div.style.background = stage.color;

        if (stage.sub) {
            div.innerHTML = `<div>${stage.title}</div><div class="sub-text">${stage.sub}</div>`;
        } else {
            div.innerHTML = `<div>${stage.title}</div>`;
        }

        sidebar.appendChild(div);

        const targetCell = document.getElementById(`cell-${stage.alignCell}`);
        if (targetCell) {
            const cellRect = targetCell.getBoundingClientRect();
            const centerTop = (cellRect.top - sidebarRect.top) + (cellRect.height / 2);
            div.style.top = `${centerTop}px`;
        }
    });
}

window.addEventListener('resize', () => {
    renderSidebar();
});

function renderScatterPool() {
    const poolEl = document.getElementById('scatterPool');
    poolEl.innerHTML = '';
    
    const positions = generateNonOverlappingPositions();

    remainingPieces.forEach((piece, index) => {
        if (!piece) return;
        
        const pieceEl = document.createElement('div');
        pieceEl.className = 'scatter-piece';
        pieceEl.id = `scatter-piece-${index}`;
        
        const pos = positions[index];
        pieceEl.style.left = pos.left + '%';
        pieceEl.style.top = pos.top + '%';
        pieceEl.style.transform = `rotate(${pos.rotate}deg)`;
        
        pieceEl.onclick = () => drawSpecificPiece(index, pieceEl);
        poolEl.appendChild(pieceEl);
    });
}

// 只有在尚未開始排命盤前 (currentIndex === 0) 才能洗牌
function shuffleScatterPool() {
    if (currentIndex > 0 || shuffleCount <= 0) return;
    
    shuffleCount--;
    remainingPieces = shuffle([...remainingPieces]);
    updateShuffleBtn();

    const domPieces = document.querySelectorAll('.scatter-piece:not(.drawn)');
    
    domPieces.forEach(el => {
        const offsetX = (Math.random() - 0.5) * 12;
        const offsetY = (Math.random() - 0.5) * 12;
        el.style.left = (50 + offsetX) + '%';
        el.style.top = (50 + offsetY) + '%';
        el.style.transform = `rotate(${Math.random() * 360}deg) scale(1.08)`;
    });

    setTimeout(() => {
        const newPositions = generateNonOverlappingPositions();
        domPieces.forEach((el, idx) => {
            const pos = newPositions[idx];
            el.style.left = pos.left + '%';
            el.style.top = pos.top + '%';
            el.style.transform = `rotate(${pos.rotate}deg) scale(1)`;
        });
    }, 450);
}

function updateShuffleBtn() {
    const btn = document.getElementById('shuffleBtn');
    if (currentIndex > 0) {
        btn.innerText = `🔒 排盤中不可洗牌`;
        btn.disabled = true;
    } else if (shuffleCount <= 0) {
        btn.innerText = `✋ 洗牌 (已用盡)`;
        btn.disabled = true;
    } else {
        btn.innerText = `✋ 洗牌 (剩 ${shuffleCount} 次)`;
        btn.disabled = false;
    }
}

// 電腦版動態調整右側操作介面高度，手機版則將落子格子捲動至上方可視區域中央
function syncPanelHeightToCell(position) {
    const wrapper = document.getElementById('controlWrapper');
    const panel = document.getElementById('controlPanel');
    const boardCard = document.getElementById('boardCard');
    const cell = document.getElementById(`cell-${position}`);

    document.querySelectorAll('.cell.active-target').forEach(el => {
        el.classList.remove('active-target');
    });

    if (!position || !cell) {
        wrapper.style.transform = 'translateY(0px)';
        return;
    }

    cell.classList.add('active-target');

    // 手機與平板直向模式 (寬度 <= 820px)：計算上方扣除底部抽屜後的可視中心點並平滑捲動
    if (window.innerWidth <= 820) {
        wrapper.style.transform = 'none';
        const panelHeight = panel.offsetHeight;
        const visibleHeight = window.innerHeight - panelHeight;
        const cellRect = cell.getBoundingClientRect();
        const absoluteCellTop = window.pageYOffset + cellRect.top;
        const targetScrollY = absoluteCellTop - (visibleHeight / 2) + (cellRect.height / 2);

        window.scrollTo({
            top: Math.max(0, targetScrollY),
            behavior: 'smooth'
        });
        return;
    }

    // 電腦版：動態位移右側操作面板對齊剛落子的高度
    const boardRect = boardCard.getBoundingClientRect();
    const cellRect = cell.getBoundingClientRect();
    const cellCenterRelative = (cellRect.top - boardRect.top) + (cellRect.height / 2);

    const drawnDisplay = document.getElementById('drawnDisplay');
    const panelRect = panel.getBoundingClientRect();
    const drawnRect = drawnDisplay.getBoundingClientRect();
    const anchorOffsetInPanel = (drawnRect.top - panelRect.top) + (drawnRect.height / 2);

    const maxOffset = Math.max(0, boardCard.offsetHeight - panel.offsetHeight);
    let targetOffset = cellCenterRelative - anchorOffsetInPanel;
    targetOffset = Math.max(0, Math.min(targetOffset, maxOffset));

    wrapper.style.transform = `translateY(${targetOffset}px)`;

    setTimeout(() => {
        cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
}

function drawSpecificPiece(index, el) {
    if (currentIndex >= 32) return;
    
    const piece = remainingPieces[index];
    if (!piece) return;
    
    remainingPieces[index] = null;
    el.classList.add('drawn');
    
    placePieceOnBoard(piece);
}

function placePieceOnBoard(piece) {
    const position = currentIndex + 1;
    const cell = document.getElementById(`cell-${position}`);

    cell.classList.remove('covered');

    const pieceEl = document.createElement('div');
    pieceEl.className = `chess-piece ${piece.color} flip-animate`;
    pieceEl.textContent = piece.name;
    cell.appendChild(pieceEl);

    document.getElementById('drawnDisplay').innerHTML =
        `<div class="chess-piece ${piece.color}" style="margin:0 auto; transform:scale(0.82);">${piece.name}</div>`;

    placedPieces[position] = piece;
    currentIndex++;
    document.getElementById('poolCount').textContent = 32 - currentIndex;

    updateShuffleBtn();
    syncPanelHeightToCell(position);

    if (currentIndex < 32) {
        document.getElementById('orderIndicator').textContent =
            `下一步：放置於第 ${currentIndex + 1} 顆`;
    } else {
        document.getElementById('completeMsg').textContent = '✅ 命盤排列完成！';
        document.getElementById('orderIndicator').textContent = '所有棋子皆已歸位';
        generateInterpretation(false);
    }
}

function resetGame() {
    remainingPieces = shuffle([...pieceSet]);
    currentIndex = 0;
    placedPieces = {}; 
    shuffleCount = 3;
    
    document.getElementById('poolCount').textContent = 32;
    document.getElementById('completeMsg').innerHTML = '';
    document.getElementById('drawnDisplay').innerHTML =
        '<div style="color:#9E9589; font-size:11px;">待翻牌</div>';
    document.getElementById('orderIndicator').textContent =
        '下一步：放置於第 1 顆（紅框處）';
        
    updateShuffleBtn();
    renderBoard();
    setTimeout(renderSidebar, 30);
    renderScatterPool();

    syncPanelHeightToCell(null);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = resetGame;

function captureBoard() {
    const boardCard = document.querySelector('.board-card');
    html2canvas(boardCard, {
        backgroundColor: '#F6F3EC',
        scale: 2
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `象棋卜卦命盤_${new Date().getTime()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    });
}

function saveResult() {
    if (currentIndex === 0) {
        alert("尚未抽取任何棋子，無資料可儲存！");
        return;
    }
    const name = prompt("請為您的命盤命名（例如：2026生涯占卜）:");
    if (!name) return;

    const resultData = {
        name: name,
        timestamp: new Date().toISOString(),
        pieces: placedPieces,
        pool: remainingPieces,
        shuffleCount: shuffleCount
    };

    let savedResults = JSON.parse(localStorage.getItem('chessDivinationResults') || '[]');
    savedResults.push(resultData);
    localStorage.setItem('chessDivinationResults', JSON.stringify(savedResults));

    alert(`命盤「${name}」已儲存！`);
    generateInterpretation(true);
}

function loadResult() {
    let savedResults = JSON.parse(localStorage.getItem('chessDivinationResults') || '[]');
    if (savedResults.length === 0) {
        alert("沒有已儲存的命盤紀錄。");
        return;
    }
    const savedNames = savedResults.map(r => r.name);
    const selectedName = prompt(`請選擇要載入的命盤：\n${savedNames.join('\n')}`);
    if (!selectedName) return;

    const resultToLoad = savedResults.find(r => r.name === selectedName);
    if (!resultToLoad) {
        alert("找不到該命盤紀錄。");
        return;
    }

    placedPieces = resultToLoad.pieces || {};
    remainingPieces = resultToLoad.pool || [];
    shuffleCount = resultToLoad.shuffleCount !== undefined ? resultToLoad.shuffleCount : 3;
    currentIndex = Object.keys(placedPieces).length;
    
    document.getElementById('poolCount').textContent = 32 - currentIndex;
    
    updateShuffleBtn();
    
    if (currentIndex >= 32) {
        document.getElementById('orderIndicator').textContent = '✅ 命盤排列完成！';
    } else {
        document.getElementById('orderIndicator').textContent = `下一步：放置於第 ${currentIndex + 1} 顆`;
    }
    
    const lastPiece = placedPieces[currentIndex];
    if (lastPiece) {
        document.getElementById('drawnDisplay').innerHTML =
            `<div class="chess-piece ${lastPiece.color}" style="margin:0 auto; transform:scale(0.82);">${lastPiece.name}</div>`;
    }
    
    document.getElementById('completeMsg').textContent = `✅ 命盤「${resultToLoad.name}」已載入`;

    renderLoadedBoard();
    renderScatterPool();
    
    if (currentIndex > 0 && currentIndex < 32) {
        syncPanelHeightToCell(currentIndex);
    } else {
        syncPanelHeightToCell(null);
    }
}

function renderLoadedBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';
    boardLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';
        row.nums.forEach(num => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${num}`;
            if (num === 1) cell.classList.add('start-cell');

            const piece = placedPieces[num];
            if (piece) {
                const pieceEl = document.createElement('div');
                pieceEl.className = `chess-piece ${piece.color}`;
                pieceEl.textContent = piece.name;
                cell.appendChild(pieceEl);
            } else {
                cell.classList.add('covered');
                const label = document.createElement('span');
                label.className = 'cell-number';
                label.textContent = num;
                cell.appendChild(label);
            }
            rowDiv.appendChild(cell);
        });
        grid.appendChild(rowDiv);
    });
    setTimeout(renderSidebar, 30);
}

function generateInterpretation(isSaved = false) {
    let interpretationHtml = "";
    const title = isSaved ? "命盤解讀" : "本次占卜結果";

    const stageOrder = ['總格','學習格','情感格','事業格','41~50','51~60','61~70','71-80'];
    const stagePieceCounts = {};
    stageOrder.forEach(stage => stagePieceCounts[stage] = { red: 0, black: 0, total: 0 });

    for (const posStr in placedPieces) {
        const pos = parseInt(posStr);
        const piece = placedPieces[pos];
        let currentStage = '總格';
        for (const stage of stageRanges) {
            if (pos >= stage.range[0] && pos <= stage.range[1]) {
                currentStage = stage.key;
                break;
            }
        }
        if (stagePieceCounts[currentStage]) {
            stagePieceCounts[currentStage][piece.color]++;
            stagePieceCounts[currentStage].total++;
        }
    }

    interpretationHtml += `<div style="font-size:14px; margin-bottom:4px;">📋 ${title}</div><ul style="text-align:left; font-size:12px; margin:0; padding-left:18px;">`;
    stageOrder.forEach(stageKey => {
        const c = stagePieceCounts[stageKey];
        const stageObj = stageRanges.find(s => s.key === stageKey);
        const displayTitle = stageObj ? (stageObj.sub ? `${stageObj.title}(${stageObj.sub})` : stageObj.title) : stageKey;
        if (c && c.total > 0) {
            interpretationHtml += `<li><strong>${displayTitle}</strong>：紅棋 ${c.red} 顆、黑棋 ${c.black} 顆</li>`;
        }
    });
    interpretationHtml += "</ul>";

    if (isSaved) {
        alert("命盤已儲存！\n" + interpretationHtml.replace(/<[^>]*>/g, '').replace(/紅棋/g, '\n紅棋'));
    } else {
        document.getElementById('completeMsg').innerHTML = interpretationHtml;
    }
}
</script>
