<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>中國象棋卜卦命盤系統</title>
<style>
body {
    font-family: "微軟正黑體", sans-serif;
    background: linear-gradient(135deg, #2c1810, #3d2817);
    color: #fff;
    text-align: center;
    padding: 20px;
}

h1 { color: #ffd54f; margin-bottom: 20px; }

.main-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.board-card {
    display: flex;
    background: #4a2f1f;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.stage-sidebar {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin-right: 15px;
    width: 70px;
}

.stage-label {
    writing-mode: vertical-rl;
    font-size: 13px;
    border-radius: 6px;
    padding: 6px 2px;
    margin: 2px 0;
    color: #222;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
}

.board-content { flex: 1; }

.board-title {
    font-size: 20px;
    color: #ffd54f;
    margin-bottom: 10px;
    letter-spacing: 4px;
}

.board-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
}

.board-row {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.cell {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.cell.covered {
    background: linear-gradient(145deg, #8b6914, #6b4e0a);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

.cell.start-cell {
    border: 3px solid red;
    box-shadow: 0 0 10px rgba(255,0,0,0.6);
}

.cell-number {
    position: absolute;
    top: -18px;
    font-size: 11px;
    color: #ffd54f;
}

.chess-piece {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    box-shadow:
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.3),
        inset 0 -2px 4px rgba(0,0,0,0.3);
    border: 2px solid;
    transform-style: preserve-3d;
    transition: transform 0.6s;
}

.chess-piece.red {
    background: radial-gradient(circle at 30% 30%, #ffe0e0, #d32f2f);
    color: #8b0000;
    border-color: #a00;
}

.chess-piece.black {
    background: radial-gradient(circle at 30% 30%, #e0e0e0, #333);
    color: #000;
    border-color: #000;
}

.chess-piece.flip-animate {
    animation: flipAnimation 0.6s ease-in-out;
}

@keyframes flipAnimation {
    0% { transform: rotateY(0deg); opacity: 0.3; }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0deg); opacity: 1; }
}

.control-panel {
    background: #4a2f1f;
    border-radius: 12px;
    padding: 20px;
    width: 300px;
    text-align: left;
}

.pool-info { text-align: center; margin-bottom: 15px; }
.pool-count { font-size: 36px; color: #ffd54f; font-weight: bold; }
.pool-label { font-size: 13px; color: #ccc; }

.drawn-piece-display {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3a2415;
    border-radius: 8px;
    margin-bottom: 15px;
}

.draw-btn, .reset-btn {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

.draw-btn { background: #ffd54f; color: #3a2415; }
.draw-btn:disabled { background: #777; cursor: not-allowed; }
.reset-btn { background: #c62828; color: #fff; }

#completeMsg { text-align: center; color: #81c784; font-weight: bold; margin-bottom: 10px; }

.order-indicator {
    background: #3a2415;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    color: #ffd54f;
}

.hint-text { font-size: 12px; color: #aaa; margin-bottom: 15px; line-height: 1.6; }

.stage-info-section h3 { color: #ffd54f; font-size: 15px; margin-bottom: 10px; }

.stage-row {
    display: flex;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
}

.stage-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
}

.stage-range {
    color: #999;
    margin-left: auto;
    font-size: 12px;
}
</style>
</head>
<body>

<h1>🀄 中國象棋卜卦命盤系統 🀄</h1>

<div class="main-container">
    <div class="board-card">
        <div class="stage-sidebar" id="stageSidebar"></div>
        <div class="board-content">
            <div class="board-title">總　格</div>
            <div class="board-grid" id="boardGrid"></div>
        </div>
    </div>

    <div class="control-panel">
        <h2>📜 命盤卜卦控制台</h2>

        <div class="pool-info">
            <div class="pool-count" id="poolCount">32</div>
            <div class="pool-label">剩餘棋子（蓋住中）</div>
        </div>

        <div class="drawn-piece-display" id="drawnDisplay">
            <div style="color:#777; font-size:14px;">尚未抽取棋子</div>
        </div>

        <button class="draw-btn" id="drawBtn" onclick="drawPiece()">🎲 翻開棋子</button>
        <button class="reset-btn" onclick="resetGame()">🔄 重新排盤</button>

        <div id="completeMsg"></div>

        <div class="order-indicator" id="orderIndicator">
            下一步：放置於第 1 顆（紅框標示處）
        </div>

        <div class="hint-text">
            排列順序規則：依照命盤墊上的編號 1 → 2 → 3 → … → 32 依序翻開放置，
            第一顆棋子固定放置於編號 1 的紅框標示處（總格中心）。
        </div>

        <div class="stage-info-section">
            <h3>🔮 人生階段對照</h3>
            <div class="stage-row">
                <span class="stage-dot" style="background:#4fc3f7;"></span>
                學習格 <span class="stage-range">11 ~ 20 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff6ec7;"></span>
                情感格 <span class="stage-range">21 ~ 30 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ffd54f;"></span>
                事業格 <span class="stage-range">31 ~ 40 歲</span>
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#81c784;"></span>
                41 ~ 50 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ba68c8;"></span>
                51 ~ 60 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#ff8a65;"></span>
                61 ~ 70 歲
            </div>
            <div class="stage-row">
                <span class="stage-dot" style="background:#90a4ae;"></span>
                71 歲以後
            </div>
        </div>
    </div>
</div>
